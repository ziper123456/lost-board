<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vocab drill</title>
<style>
  /* Themed via tokens pushed from the main window (get_popup_theme) so the popup
     is decorated like the rest of the board; fallbacks keep the default look. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font, system-ui, -apple-system, "Segoe UI", sans-serif);
    font-size: var(--font-size, 16px);
    background: var(--board-bg, var(--bg, #141419));
    color: var(--text, #e8e8ee);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 12px;
    user-select: none;
  }
  .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .prompt-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted, #8b8b98); }
  #btn-reveal {
    background: none; border: none; color: var(--muted, #8b8b98); cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  #btn-reveal:hover { color: var(--text, #e8e8ee); background: var(--panel-2, #23232c); }
  .prompt { font-size: 1.5rem; font-weight: 700; margin: 2px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .answer { display: flex; gap: 8px; align-items: center; }
  .answer input {
    flex: 1; min-width: 0;
    background: var(--panel-2, #1e1e26); border: 1px solid var(--border, #3a3a48); color: var(--text, #e8e8ee);
    border-radius: var(--radius, 8px); padding: 8px 10px; font-size: 0.95rem; outline: none;
  }
  .answer input:focus { border-color: var(--accent, #4f8ff7); }
  .answer input.ok { border-color: var(--green, #2fae5f); background: rgba(47, 174, 95, 0.16); }
  .answer input.bad { border-color: var(--red, #d64949); background: rgba(214, 73, 73, 0.16); }
  .reveal { font-size: 0.85rem; color: var(--amber, #f0c674); min-height: 1.2em; margin-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .row button {
    flex: 1; background: var(--panel-2, #23232c); color: var(--text, #cfcfda); border: 1px solid var(--border, #3a3a48);
    border-radius: var(--radius, 8px); padding: 7px 0; font-size: 0.8rem; cursor: pointer;
  }
  .row button:hover { border-color: var(--accent, #4c4c5a); }
  .error { font-size: 0.78rem; color: var(--red, #d64949); margin-top: 6px; }
  .drill-progress { font-size: 0.68rem; color: var(--muted, #8b8b98); margin-top: 4px; }
</style>
</head>
<body>
  <div class="prompt-head">
    <div class="prompt-label" id="lang-label">Translate to Spanish</div>
    <button id="btn-reveal" title="Show answer immediately">👁</button>
  </div>
  <div class="prompt" id="prompt">…</div>
  <div class="answer"><input id="input" type="text" autocomplete="off" placeholder="type the translation" /></div>
  <div class="reveal" id="reveal"></div>
  <div class="drill-progress" id="progress"></div>
  <div class="row">
    <button id="btn-dismiss">Dismiss</button>
    <button id="btn-snooze" title="No popups for 30 minutes">Snooze 30 min</button>
  </div>
  <div class="error" id="error"></div>
<script>
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  // Port of vocab-app typingMatch: lowercase + NFD diacritic-strip + trim.
  const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

  const promptEl = document.getElementById("prompt");
  const labelEl = document.getElementById("lang-label");
  const inputEl = document.getElementById("input");
  const revealEl = document.getElementById("reveal");
  const errorEl = document.getElementById("error");
  const close = () => invoke("close_vocab_popup").catch(() => window.close());

  let targets = [];   // accepted answers in order
  let attempts = 0;
  let answered = false;   // grade recorded already?
  let gradeable = false;  // only grade cards that were actually due
  let cardId = "";

  // Record the review outcome (SM-2). Honest grading: reveal = fail ("again").
  function record(grade) {
    if (answered || !gradeable || !cardId) return;
    answered = true;
    invoke("vocab_record_review", { cardId, grade }).catch(() => {});
  }

  function checkBoth() {
    // "both" mode: two inputs must both match (mirrors vocab-app Both mode).
    const vals = [...document.querySelectorAll(".answer input")].map((i) => norm(i.value));
    return targets.every((t, i) => vals[i] === norm(t));
  }

  function onInput() {
    const done = targets.length > 1 ? checkBoth() : norm(inputEl.value) === norm(targets[0]);
    if (done) {
      inputEl.classList.remove("bad");
      inputEl.classList.add("ok");
      record(attempts === 0 ? "good" : "hard");
      setTimeout(close, 1500);
      return;
    }
    // Count an attempt on Enter with a non-empty, non-matching value.
  }

  function revealNow() {
    revealEl.textContent = "Answer: " + targets.join(" / ");
    document.querySelectorAll(".answer input").forEach((i) => i.classList.add("bad"));
    record("again");
  }

  async function boot() {
    // Pull the board's theme tokens so the popup is decorated like the tiles.
    try {
      const themeCss = await invoke("get_popup_theme");
      if (themeCss) {
        const s = document.createElement("style");
        s.textContent = themeCss;
        document.head.appendChild(s);
      }
    } catch { /* keep the fallback look */ }
    try {
      const cfg = await invoke("vocab_popup_config").catch(() => ({ lang: "es", cats: [] }));
      const lang = cfg.lang || "es";
      const cats = Array.isArray(cfg.cats) ? cfg.cats : [];
      const dueRes = await invoke("vocab_due_card", { categories: cats });
      if (!dueRes || !dueRes.card) {
        errorEl.textContent = "No cards available — clear the category filter in Settings > Vocab.";
        return;
      }
      const card = dueRes.card;
      cardId = card.id;
      gradeable = dueRes.due === true; // only grade cards that were due
      promptEl.textContent = card.en;
      promptEl.title = card.en;
      // Show review progress in the popup itself.
      try {
        const [due, stats] = await Promise.all([
          invoke("vocab_due_count", { categories: cats }),
          invoke("vocab_srs_stats", { categories: cats }),
        ]);
        const progEl = document.getElementById("progress");
        if (progEl && stats) {
          const pct = stats.total ? Math.round((stats.mature / stats.total) * 100) : 0;
          progEl.textContent = `Due today: ${due} · mastered ${pct}% (${stats.mature}/${stats.total}) · learning ${stats.learning}`;
        }
      } catch { /* progress is optional */ }
      if (lang === "both") {
        labelEl.textContent = "Translate to Spanish + German";
        const wrap = document.querySelector(".answer");
        wrap.innerHTML = `<input id="input-es" type="text" autocomplete="off" placeholder="español" /><input id="input-de" type="text" autocomplete="off" placeholder="deutsch" />`;
        targets = [card.es, card.de];
        wrap.querySelectorAll("input").forEach((i) => i.addEventListener("input", onInput));
        wrap.querySelector("input").focus();
      } else {
        const isDe = lang === "de";
        labelEl.textContent = isDe ? "Translate to German" : "Translate to Spanish";
        targets = [isDe ? card.de : card.es];
        inputEl.addEventListener("input", onInput);
        inputEl.focus();
      }
      // Enter with a wrong answer counts an attempt: 2 attempts, then reveal.
      document.querySelector(".answer").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const done = targets.length > 1 ? checkBoth() : norm(inputEl.value) === norm(targets[0]);
        if (done) return; // auto-close already scheduled by onInput
        const val = targets.length > 1
          ? [...document.querySelectorAll(".answer input")].map((i) => i.value).join(" / ")
          : inputEl.value;
        if (!norm(val)) return;
        attempts += 1;
        if (attempts >= 2) {
          revealNow();
        } else {
          document.querySelectorAll(".answer input").forEach((i) => i.classList.add("bad"));
          setTimeout(() => document.querySelectorAll(".answer input").forEach((i) => i.classList.remove("bad")), 600);
        }
      });
      document.getElementById("btn-reveal").addEventListener("click", revealNow);
    } catch (e) {
      errorEl.textContent = "Couldn't load a card: " + (e.message || e);
    }
  }

  document.getElementById("btn-dismiss").addEventListener("click", close);
  document.getElementById("btn-snooze").addEventListener("click", async () => {
    try {
      await invoke("snooze_vocab_popup");
    } catch (e) {
      errorEl.textContent = "Snooze failed: " + (e.message || e);
      return;
    }
    close();
  });

  boot();
</script>
</body>
</html>
