<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vocab drill</title>
<style>
  /* Themed via tokens pushed from the main window (get_popup_theme) so the popup
     is decorated like the rest of the board; fallbacks keep the default look. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font, system-ui, -apple-system, "Segoe UI", sans-serif);
    font-size: var(--font-size, 16px);
    background: var(--board-bg, var(--bg, #141419));
    color: var(--text, #e8e8ee);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 12px;
    user-select: none;
  }
  .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .prompt-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted, #8b8b98); }
  #btn-reveal {
    background: none; border: none; color: var(--muted, #8b8b98); cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  #btn-reveal:hover { color: var(--text, #e8e8ee); background: var(--panel-2, #23232c); }
  .mode-badge {
    display: none; align-self: flex-start; margin-top: 6px;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--amber, #f0c674); border: 1px solid var(--amber, #f0c674);
    border-radius: 999px; padding: 1px 8px;
  }
  .prompt { font-size: 1.5rem; font-weight: 700; margin: 2px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .answer { display: flex; gap: 8px; align-items: center; }
  .answer input {
    flex: 1; min-width: 0;
    background: var(--panel-2, #1e1e26); border: 1px solid var(--border, #3a3a48); color: var(--text, #e8e8ee);
    border-radius: var(--radius, 8px); padding: 8px 10px; font-size: 0.95rem; outline: none;
  }
  .answer input:focus { border-color: var(--accent, #4f8ff7); }
  .answer input.ok { border-color: var(--green, #2fae5f); background: rgba(47, 174, 95, 0.16); }
  .answer input.bad { border-color: var(--red, #d64949); background: rgba(214, 73, 73, 0.16); }
  .reveal { font-size: 0.85rem; color: var(--amber, #f0c674); min-height: 1.2em; margin-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .row button {
    flex: 1; background: var(--panel-2, #23232c); color: var(--text, #cfcfda); border: 1px solid var(--border, #3a3a48);
    border-radius: var(--radius, 8px); padding: 7px 0; font-size: 0.8rem; cursor: pointer;
  }
  .row button:hover { border-color: var(--accent, #4c4c5a); }
  .error { font-size: 0.78rem; color: var(--red, #d64949); margin-top: 6px; }
  .drill-progress { font-size: 0.68rem; color: var(--muted, #8b8b98); margin-top: 4px; }
</style>
</head>
<body>
  <div class="prompt-head">
    <div class="prompt-label" id="lang-label">Translate to Spanish</div>
    <button id="btn-reveal" title="Show answer immediately">👁</button>
  </div>
  <div class="mode-badge" id="mode-badge"></div>
  <div class="prompt" id="prompt">…</div>
  <div class="answer"><input id="input" type="text" autocomplete="off" placeholder="type the translation" /></div>
  <div class="reveal" id="reveal"></div>
  <div class="drill-progress" id="progress"></div>
  <div class="row">
    <button id="btn-dismiss">Dismiss</button>
    <button id="btn-snooze" title="No popups for 30 minutes">Snooze 30 min</button>
  </div>
  <div class="error" id="error"></div>
<script>
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  // Port of vocab-app typingMatch: lowercase + NFD diacritic-strip + trim.
  const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

  const promptEl = document.getElementById("prompt");
  const labelEl = document.getElementById("lang-label");
  const revealEl = document.getElementById("reveal");
  const errorEl = document.getElementById("error");
  const progressEl = document.getElementById("progress");
  const badgeEl = document.getElementById("mode-badge");
  const answerWrap = document.querySelector(".answer");
  const close = () => invoke("close_vocab_popup").catch(() => window.close());

  let mode = "review";        // "review" (graded) | "practice" (never graded)
  let lang = "es";
  let queue = [];             // [{ card, due }] — one session's worth of cards
  let idx = 0;
  let targets = [];           // accepted answers in order
  let attempts = 0;
  let answered = false;       // grade recorded for the current card?
  let gradeable = false;      // only grade cards that were actually due
  let cardDone = false;       // guards against advancing twice
  let cardId = "";

  // Record the review outcome (SM-2). Honest grading: reveal = fail ("again").
  // Practice mode is never graded, so extra reps leave the schedule untouched.
  function record(grade) {
    if (mode === "practice") return;
    if (answered || !gradeable || !cardId) return;
    answered = true;
    invoke("vocab_record_review", { cardId, grade }).catch(() => {});
  }

  const inputs = () => [...document.querySelectorAll(".answer input")];
  function isCorrect() {
    const vals = inputs().map((i) => norm(i.value));
    return targets.length > 1
      ? targets.every((t, i) => vals[i] === norm(t))
      : norm(inputs()[0]?.value) === norm(targets[0]);
  }

  function finishCard(delay) {
    if (cardDone) return;
    cardDone = true;
    setTimeout(advance, delay);
  }

  function onInput() {
    if (cardDone || !isCorrect()) return;
    inputs().forEach((i) => { i.classList.remove("bad"); i.classList.add("ok"); });
    record(attempts === 0 ? "good" : "hard");
    finishCard(mode === "practice" ? 700 : 1100);
  }

  function revealNow() {
    revealEl.textContent = "Answer: " + targets.join(" / ");
    inputs().forEach((i) => i.classList.add("bad"));
    record("again");
    finishCard(mode === "practice" ? 1700 : 2100);
  }

  function advance() {
    idx += 1;
    if (idx >= queue.length) {
      close();
      return;
    }
    renderCard();
  }

  function makeInput(placeholder) {
    const i = document.createElement("input");
    i.type = "text";
    i.autocomplete = "off";
    i.placeholder = placeholder;
    i.addEventListener("input", onInput);
    return i;
  }

  function updateProgress() {
    const pos = `Card ${idx + 1}/${queue.length}`;
    if (mode === "practice") {
      progressEl.textContent = `${pos} · practice (not graded)`;
      return;
    }
    progressEl.textContent = `${pos} · …`;
    invoke("vocab_due_count", { categories: cats })
      .then(async (due) => {
        const stats = await invoke("vocab_srs_stats", { categories: cats }).catch(() => null);
        const pct = stats && stats.total ? Math.round((stats.mature / stats.total) * 100) : 0;
        progressEl.textContent = stats && stats.total
          ? `${pos} · ${due} due · mastered ${pct}% (${stats.mature}/${stats.total}) · learning ${stats.learning}`
          : `${pos} · ${due} due`;
      })
      .catch(() => { progressEl.textContent = pos; });
  }

  function renderCard() {
    const { card, due } = queue[idx];
    cardId = card.id;
    gradeable = mode === "review" && due === true; // practice/early cards are never graded
    answered = false;
    attempts = 0;
    cardDone = false;
    revealEl.textContent = "";
    errorEl.textContent = "";
    promptEl.textContent = card.en;
    promptEl.title = card.en;
    labelEl.textContent =
      lang === "both" ? "Translate to Spanish + German" : lang === "de" ? "Translate to German" : "Translate to Spanish";

    answerWrap.innerHTML = "";
    if (lang === "both") {
      answerWrap.append(makeInput("español"), makeInput("deutsch"));
      targets = [card.es, card.de];
    } else {
      answerWrap.append(makeInput("type the translation"));
      targets = [lang === "de" ? card.de : card.es];
    }
    updateProgress();
    inputs()[0]?.focus();
  }

  let cats = [];

  async function boot() {
    // Pull the board's theme tokens so the popup is decorated like the tiles.
    try {
      const themeCss = await invoke("get_popup_theme");
      if (themeCss) {
        const s = document.createElement("style");
        s.textContent = themeCss;
        document.head.appendChild(s);
      }
    } catch { /* keep the fallback look */ }
    try {
      const cfg = (await invoke("vocab_popup_config").catch(() => ({}))) || {};
      lang = cfg.lang || "es";
      cats = Array.isArray(cfg.cats) ? cfg.cats : [];
      mode = cfg.practice === true ? "practice" : "review";
      const limit = Number(cfg.session_size) || 0; // 1 default; 0 = all due
      if (mode === "practice") {
        badgeEl.style.display = "inline-block";
        badgeEl.textContent = "Practice — not graded";
        const cards = await invoke("vocab_practice_batch", { categories: cats, limit });
        queue = (cards || []).map((c) => ({ card: c, due: false }));
      } else {
        const batch = await invoke("vocab_due_batch", {
          categories: cats,
          limit,
          preferStruggling: cfg.struggling_first !== false,
        });
        queue = (batch || []).map((d) => ({ card: d.card, due: d.due === true }));
      }
      if (!queue.length) {
        errorEl.textContent = mode === "practice"
          ? "No struggling cards to practise right now."
          : "No cards available — clear the category filter in Settings > Vocab.";
        return;
      }
      renderCard();
      answerWrap.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        if (isCorrect()) return; // onInput already scheduled the advance
        if (!inputs().some((i) => norm(i.value))) return;
        attempts += 1;
        if (attempts >= 2) {
          revealNow();
        } else {
          inputs().forEach((i) => i.classList.add("bad"));
          setTimeout(() => inputs().forEach((i) => i.classList.remove("bad")), 600);
        }
      });
      document.getElementById("btn-reveal").addEventListener("click", revealNow);
    } catch (e) {
      errorEl.textContent = "Couldn't load a card: " + (e.message || e);
    }
  }

  document.getElementById("btn-dismiss").addEventListener("click", close);
  document.getElementById("btn-snooze").addEventListener("click", async () => {
    try {
      await invoke("snooze_vocab_popup");
    } catch (e) {
      errorEl.textContent = "Snooze failed: " + (e.message || e);
      return;
    }
    close();
  });

  boot();
</script>
</body>
</html>
