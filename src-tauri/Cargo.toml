[package]
name = "lost-board"
version = "0.1.0"
description = "Personal dashboard launcher — folders, solutions, bookmarks, Azure, Spotify, weather, news, healthcheck, system stats"
edition = "2021"
default-run = "lost-board"

[lib]
name = "lost_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = "9.1.3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
rfd = "0.15"
reqwest = { version = "0.12", features = ["json"] }
feed-rs = "1.5"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
rand = "0.8"
tiny_http = "0.12"
url = "2"
csv = "1"
chrono = "0.4"
whatlang = "0.16"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
imageproc = "0.25"
ab_glyph = "0.2"
gif = "0.13"
wasapi = "0.26.0"
vosk = "0.3.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
