[package]
name = "lost-board"
version = "0.1.0"
description = "Personal dashboard launcher — folders, solutions, bookmarks, Azure, Spotify, weather, news, healthcheck, system stats"
edition = "2021"

[lib]
name = "lost_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
rfd = "0.15"
reqwest = { version = "0.12", features = ["json"] }
feed-rs = "1.5"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rdev = "0.5"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
